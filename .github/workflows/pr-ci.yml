name: pr-ci

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # Next 16.2+ uses Turbopack for production builds; `--no-turbo` was removed from the CLI.
        # If linux CI hits lightningcss native resolution issues, pin/install the correct optional deps for the runner.
        run: npm run build
